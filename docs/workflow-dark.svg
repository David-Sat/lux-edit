<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <marker id="arr-accent-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f2724b" />
    </marker>
    <pattern id="dotGridDark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.08" />
    </pattern>
    <style>
      .bg-panel-dark { fill: #161b22; stroke: #30363d; }
      .text-title-dark { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #f0f6fc; font-size: 11.5px; }
      .text-body-dark { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #8b949e; font-size: 8.5px; }
      .text-mono-dark { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .agent-box-dark { fill: rgba(56, 139, 253, 0.08); stroke: rgba(56, 139, 253, 0.45); stroke-width: 1.3; stroke-dasharray: 5,4; }
      .review-box-dark { fill: rgba(242, 114, 75, 0.08); stroke: rgba(242, 114, 75, 0.45); stroke-width: 1.2; }
      .auto-box-dark { fill: #161b22; stroke: #30363d; stroke-width: 1.2; stroke-dasharray: 3,3; }
    </style>
  </defs>

  <rect width="1000" height="230" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1" />
  <rect width="1000" height="230" fill="url(#dotGridDark)" rx="8" />

  <!-- Connecting Step Arrows -->
  <path d="M 236,115 H 274" fill="none" stroke="#f2724b" stroke-width="1.4" marker-end="url(#arr-accent-dark)" />
  <path d="M 488,115 H 526" fill="none" stroke="#f2724b" stroke-width="1.4" marker-end="url(#arr-accent-dark)" />
  <path d="M 740,115 H 778" fill="none" stroke="#f2724b" stroke-width="1.4" marker-end="url(#arr-accent-dark)" />

  <!-- Step 1: Initialize -->
  <g id="flow-step-1">
    <rect x="24" y="24" width="212" height="182" rx="8" class="agent-box-dark" />
    <rect x="36" y="36" width="80" height="18" rx="3" fill="#161b22" stroke="rgba(56, 139, 253, 0.5)" stroke-width="1" />
    <text x="76" y="48" fill="#58a6ff" font-size="8" class="text-mono-dark" font-weight="700" text-anchor="middle">START</text>
    
    <rect x="36" y="64" width="188" height="36" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1" />
    <text x="46" y="81" fill="#58a6ff" font-size="11" class="text-mono-dark" font-weight="700">/lux</text>
    <text x="46" y="93" fill="#8b949e" font-size="7.5" class="text-mono-dark">Chat Command or npx lux</text>

    <text x="36" y="120" class="text-title-dark">Agent Starts Proxy</text>
    <text x="36" y="136" class="text-body-dark">User types /lux in chat.</text>
    <text x="36" y="150" class="text-body-dark">Agent starts proxy on :4320.</text>
    
    <rect x="36" y="172" width="128" height="18" rx="3" fill="#161b22" stroke="rgba(56, 139, 253, 0.4)" stroke-width="0.8" />
    <text x="100" y="184" fill="#58a6ff" font-size="8" class="text-mono-dark" font-weight="600" text-anchor="middle">Reverse Proxy &amp; Injection</text>
  </g>

  <!-- Step 2: In-Browser Visual Review -->
  <g id="flow-step-2">
    <rect x="276" y="24" width="212" height="182" rx="8" class="review-box-dark" />
    <rect x="288" y="36" width="60" height="18" rx="3" fill="#161b22" stroke="rgba(242, 114, 75, 0.5)" stroke-width="0.8" />
    <text x="318" y="48" fill="#f2724b" font-size="8" class="text-mono-dark" font-weight="700" text-anchor="middle">REVIEW</text>

    <rect x="288" y="64" width="188" height="36" rx="4" fill="#161b22" stroke="#f2724b" stroke-width="1" />
    <text x="298" y="81" fill="#f2724b" font-size="10.5" class="text-mono-dark" font-weight="700">V (Edit) • C (Pin) • R</text>
    <text x="298" y="93" fill="#8b949e" font-size="7.5" class="text-mono-dark">In-Browser Overlay Hotkeys</text>

    <text x="288" y="120" class="text-title-dark">Visual Edits &amp; Pins</text>
    <text x="288" y="136" class="text-body-dark">Inspect elements, adjust styling,</text>
    <text x="288" y="150" class="text-body-dark">and drop pinned comment notes.</text>

    <rect x="288" y="172" width="124" height="18" rx="3" fill="#161b22" stroke="rgba(242, 114, 75, 0.4)" stroke-width="0.8" />
    <text x="350" y="184" fill="#f2724b" font-size="8" class="text-mono-dark" font-weight="600" text-anchor="middle">Real-Time WS Draft Sync</text>
  </g>

  <!-- Step 3: Agent Ingestion via MCP -->
  <g id="flow-step-3">
    <rect x="528" y="24" width="212" height="182" rx="8" class="agent-box-dark" />
    <rect x="540" y="36" width="76" height="18" rx="3" fill="#161b22" stroke="rgba(56, 139, 253, 0.5)" stroke-width="1" />
    <text x="578" y="48" fill="#58a6ff" font-size="8" class="text-mono-dark" font-weight="700" text-anchor="middle">APPLY</text>

    <rect x="540" y="64" width="188" height="36" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1" />
    <text x="550" y="81" fill="#58a6ff" font-size="11" class="text-mono-dark" font-weight="700">/lux</text>
    <text x="550" y="93" fill="#8b949e" font-size="7.5" class="text-mono-dark">lux_get_pending_review()</text>

    <text x="540" y="120" class="text-title-dark">Agent Applies Diffs</text>
    <text x="540" y="136" class="text-body-dark">User runs /lux in chat.</text>
    <text x="540" y="150" class="text-body-dark">Agent retrieves AST deltas &amp; notes.</text>

    <rect x="540" y="172" width="134" height="18" rx="3" fill="#161b22" stroke="rgba(56, 139, 253, 0.4)" stroke-width="0.8" />
    <text x="607" y="184" fill="#58a6ff" font-size="8" class="text-mono-dark" font-weight="600" text-anchor="middle">Instant Non-Blocking Tool</text>
  </g>

  <!-- Step 4: Automated Background Resolution -->
  <g id="flow-step-4">
    <rect x="780" y="24" width="196" height="182" rx="8" class="auto-box-dark" />
    <rect x="792" y="36" width="90" height="18" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
    <text x="837" y="48" fill="#8b949e" font-size="7.5" class="text-mono-dark" font-weight="700" text-anchor="middle">AUTO-RESOLVE</text>

    <rect x="792" y="64" width="172" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" stroke-dasharray="2,2" />
    <text x="802" y="81" fill="#c9d1d9" font-size="9" class="text-mono-dark" font-weight="700">Code Edit • Auto-Sync</text>
    <text x="802" y="93" fill="#8b949e" font-size="7.5" class="text-mono-dark">Background File Watcher</text>

    <text x="792" y="120" class="text-title-dark">Zero-Action Sync</text>
    <text x="792" y="136" class="text-body-dark">Agent edits files. Watcher auto-</text>
    <text x="792" y="150" class="text-body-dark">resolves and reloads app UI.</text>

    <rect x="792" y="172" width="138" height="18" rx="3" fill="#21262d" />
    <text x="861" y="184" fill="#8b949e" font-size="7.5" class="text-mono-dark" font-weight="600" text-anchor="middle">Automated / No User Action</text>
  </g>
</svg>
