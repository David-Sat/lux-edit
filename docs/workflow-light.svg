<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 238" width="100%" height="100%">
  <defs>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e8592c" />
    </marker>
    <style>
      .text-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #1f2328; font-size: 12.5px; }
      .text-body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #57606a; font-size: 9px; line-height: 1.4; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .agent-box { fill: #f6f8fa; stroke: rgba(37, 99, 235, 0.4); stroke-width: 1.4; stroke-dasharray: 5,4; }
      .review-box { fill: #fffcfb; stroke: rgba(232, 89, 44, 0.45); stroke-width: 1.4; }
      .auto-box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; stroke-dasharray: 4,4; }
      .tag-link { text-decoration: none; }
      .tag-link:hover rect { fill: #eef2ff; stroke: #4f46e5; }
    </style>
  </defs>

  <!-- Top Tag: agent-plugins.org -->
  <a href="https://agent-plugins.org/" target="_blank" class="tag-link">
    <g id="top-plugin-tag">
      <rect x="382" y="3" width="236" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
      <circle cx="396" cy="15" r="3.5" fill="#10b981" />
      <text x="406" y="18.5" fill="#4f46e5" font-size="9" class="text-mono" font-weight="700">AGENT-PLUGINS.ORG</text>
      <text x="522" y="18.5" fill="#57606a" font-size="9" class="text-mono">STANDARD</text>
      <path d="M 602 12 L 606 15 L 602 18" fill="none" stroke="#656d76" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </a>

  <!-- Connecting Step Arrows -->
  <path d="M 232,133 H 262" fill="none" stroke="#e8592c" stroke-width="1.6" marker-end="url(#arr-accent)" />
  <path d="M 488,133 H 518" fill="none" stroke="#e8592c" stroke-width="1.6" marker-end="url(#arr-accent)" />
  <path d="M 744,133 H 774" fill="none" stroke="#e8592c" stroke-width="1.6" marker-end="url(#arr-accent)" />

  <!-- Step 1: Initialize -->
  <g id="flow-step-1">
    <rect x="6" y="38" width="226" height="190" rx="10" class="agent-box" />
    <rect x="18" y="48" width="80" height="20" rx="4" fill="#ffffff" stroke="rgba(37, 99, 235, 0.45)" stroke-width="1" />
    <text x="58" y="62" fill="#2563eb" font-size="8.5" class="text-mono" font-weight="700" text-anchor="middle">START</text>
    
    <rect x="18" y="74" width="202" height="40" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
    <text x="28" y="93" fill="#2563eb" font-size="12" class="text-mono" font-weight="700">/lux</text>
    <text x="28" y="106" fill="#57606a" font-size="8" class="text-mono">Chat Command or npx lux</text>

    <text x="18" y="133" class="text-title">Agent Starts Proxy</text>
    <text x="18" y="150" class="text-body">User types /lux in chat.</text>
    <text x="18" y="165" class="text-body">Agent starts proxy on :4320.</text>
    
    <rect x="18" y="188" width="138" height="20" rx="4" fill="#ffffff" stroke="rgba(37, 99, 235, 0.4)" stroke-width="0.9" />
    <text x="87" y="202" fill="#2563eb" font-size="8.5" class="text-mono" font-weight="600" text-anchor="middle">Reverse Proxy &amp; Injection</text>
  </g>

  <!-- Step 2: In-Browser Visual Review -->
  <g id="flow-step-2">
    <rect x="262" y="38" width="226" height="190" rx="10" class="review-box" />
    <rect x="274" y="48" width="66" height="20" rx="4" fill="#ffffff" stroke="rgba(232, 89, 44, 0.45)" stroke-width="1" />
    <text x="307" y="62" fill="#e8592c" font-size="8.5" class="text-mono" font-weight="700" text-anchor="middle">REVIEW</text>

    <rect x="274" y="74" width="202" height="40" rx="5" fill="#ffffff" stroke="#e8592c" stroke-width="1.2" />
    <text x="284" y="93" fill="#e8592c" font-size="11" class="text-mono" font-weight="700">V (Edit) • C (Pin) • R</text>
    <text x="284" y="106" fill="#57606a" font-size="8" class="text-mono">In-Browser Overlay Hotkeys</text>

    <text x="274" y="133" class="text-title">Visual Edits &amp; Pins</text>
    <text x="274" y="150" class="text-body">Inspect elements, adjust styling,</text>
    <text x="274" y="165" class="text-body">and drop pinned comment notes.</text>

    <rect x="274" y="188" width="136" height="20" rx="4" fill="#ffffff" stroke="rgba(232, 89, 44, 0.4)" stroke-width="0.9" />
    <text x="342" y="202" fill="#e8592c" font-size="8.5" class="text-mono" font-weight="600" text-anchor="middle">Real-Time WS Draft Sync</text>
  </g>

  <!-- Step 3: Agent Ingestion via MCP -->
  <g id="flow-step-3">
    <rect x="518" y="38" width="226" height="190" rx="10" class="agent-box" />
    <rect x="530" y="48" width="76" height="20" rx="4" fill="#ffffff" stroke="rgba(37, 99, 235, 0.45)" stroke-width="1" />
    <text x="568" y="62" fill="#2563eb" font-size="8.5" class="text-mono" font-weight="700" text-anchor="middle">APPLY</text>

    <rect x="530" y="74" width="202" height="40" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
    <text x="540" y="93" fill="#2563eb" font-size="12" class="text-mono" font-weight="700">/lux</text>
    <text x="540" y="106" fill="#57606a" font-size="8" class="text-mono">lux_get_pending_review()</text>

    <text x="530" y="133" class="text-title">Agent Applies Diffs</text>
    <text x="530" y="150" class="text-body">User runs /lux in chat.</text>
    <text x="530" y="165" class="text-body">Agent retrieves AST deltas &amp; notes.</text>

    <rect x="530" y="188" width="144" height="20" rx="4" fill="#ffffff" stroke="rgba(37, 99, 235, 0.4)" stroke-width="0.9" />
    <text x="602" y="202" fill="#2563eb" font-size="8.5" class="text-mono" font-weight="600" text-anchor="middle">Instant Non-Blocking Tool</text>
  </g>

  <!-- Step 4: Automated Background Resolution -->
  <g id="flow-step-4">
    <rect x="774" y="38" width="220" height="190" rx="10" class="auto-box" />
    <rect x="786" y="48" width="94" height="20" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
    <text x="833" y="62" fill="#57606a" font-size="8" class="text-mono" font-weight="700" text-anchor="middle">AUTO-RESOLVE</text>

    <rect x="786" y="74" width="196" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" />
    <text x="796" y="93" fill="#24292f" font-size="10" class="text-mono" font-weight="700">Code Edit • Auto-Sync</text>
    <text x="796" y="106" fill="#57606a" font-size="8" class="text-mono">Background File Watcher</text>

    <text x="786" y="133" class="text-title">Zero-Action Sync</text>
    <text x="786" y="150" class="text-body">Agent edits files. Watcher auto-</text>
    <text x="786" y="165" class="text-body">resolves and reloads app UI.</text>

    <rect x="786" y="188" width="146" height="20" rx="4" fill="#eaeef2" />
    <text x="859" y="202" fill="#57606a" font-size="8.5" class="text-mono" font-weight="600" text-anchor="middle">Automated / No User Action</text>
  </g>
</svg>
